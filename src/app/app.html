      <div class="server-loading-spinner"></div>
      <p class="server-loading-title">กำลังโหลด server...</p>
      <p class="server-loading-subtitle">
        Server กำลังเปิดใช้งาน กรุณารอสักครู่ (ครั้งแรกอาจใช้เวลา 1–2 นาที)

    </div>
  </div>
}
